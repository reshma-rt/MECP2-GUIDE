   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start" x="21.15" y="22.1688" transform="rotate(-0 21.15 22.1688)">Controlled computational workflow</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(71.13082 61.209851)">Frozen candidates</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(63.367383 74.962144)">376 guides, 8 groups</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(47.574727 88.714437)">Dataset1 variant metadata</text>
   </g>
   <g id="text_3">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(257.33168 61.209851)">Inherited structure/context</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(266.649609 74.962144)">and bystander features</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(275.915859 88.714437)">No new RNA folding</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(471.368203 61.209851)">Explicit archived raw hits</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(462.292266 74.962144)">and authenticated reference</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(480.090586 88.714437)">No new BLAST search</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(225.896094 153.000548)">Hash-bound input and coordinate QC</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(200.442266 167.407712)">q = guide length − guide-relative position + 1</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(183.031328 181.814877)">Reference-subject coverage and intended-hit checks</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'" transform="translate(247.46457 245.292584)">Frozen normalized components</text>
    <text style="font-size: 10.3px; font-family: 'DejaVu Sans'" transform="translate(105.718867 258.782929)">Accessibility 0.25   Bystander 0.30   Specificity 0.30   Duplex 0.10   Self-structure 0.05</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(84.652031 323.163851)">Composite baseline ranking</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(65.178633 336.916144)">Within-mutation score and tie rules</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(108.662578 350.668437)">8 baseline winners</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(426.510234 323.163851)">Random-weight robustness</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(403.743281 336.916144)">10,000 simulations; seed 20260914</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(448.524961 350.668437)">8 robust selections</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(63.953789 415.471451)">Separate component-ablation comparison</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(90.684492 429.223744)">9 scenarios; 3,384 ranking rows</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(111.072539 442.976037)">Decision sensitivity only</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(434.577188 415.471451)">Staged library assembly</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(414.605039 429.223744)">8 IDs; 6 distinct RNA sequences</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(443.407031 442.976037)">No official promotion</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #435360" x="328.05" y="488.6964" transform="rotate(-0 328.05 488.6964)">Separate stage approvals and preservation checks; no biological efficacy claim.</text>
   </g>
  </g>
 </g>
