   <g id="text_1">
    <text style="font-weight: 700; font-size: 16px; font-family: 'DejaVu Sans'; text-anchor: start" x="23.94" y="22.1688" transform="rotate(-0 23.94 22.1688)">Cohort scope and computational selection</text>
   </g>
   <g id="text_2">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(246.010859 62.90693)">Historical curated cohort</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(260.246406 77.314095)">141 variant records</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(101.10625 137.75093)">Historically eligible targets</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(79.902031 152.158095)">44 groups: 8 exact + 36 nonsense</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(417.141094 138.129864)">Other historical records</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(401.916094 151.227286)">97 outside the eligible subset</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(90.346875 212.59493)">Primary corrected Tier-1 scope</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'" transform="translate(101.615 227.002095)">8 exact-restoration groups</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(408.012969 206.425153)">Historical nonsense branch</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(404.242656 219.522575)">36 groups; 1,692 candidates</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(395.814531 232.619997)">Outside the corrected Tier-1 run</text>
   </g>
   <g id="text_7">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(82.546172 280.752251)">Recovered frozen candidate library</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(97.457813 294.504544)">376 records; 47 per mutation</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(115.617891 308.256837)">No guide regeneration</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(78.798164 355.596251)">Corrected features, composite ranks</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(93.544922 369.348544)">and 10,000 weight simulations</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(111.666445 383.100837)">All 376 records retained</text>
   </g>
   <g id="text_9">
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(95.105156 437.316397)">Staged robust-selected library</text>
    <text style="font-size: 10.5px; font-family: 'DejaVu Sans'" transform="translate(74.61457 451.06869)">8 guide IDs; 6 distinct RNA sequences</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(404.70125 314.637242)">Separate expanded curation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(415.23875 327.734664)">166 variants; 51 eligible</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(417.423125 340.832086)">7 newly eligible targets</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(426.617656 353.929508)">Not integrated here</text>
   </g>
   <g id="text_11">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #435360" x="314.1" y="493.686" transform="rotate(-0 314.1 493.686)">Counts describe variant and guide records, not patients or experimental outcomes.</text>
